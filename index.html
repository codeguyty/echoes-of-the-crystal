<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Echoes of the Crystal V3</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101626;touch-action:none}#game{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center}canvas{display:block;image-rendering:pixelated;touch-action:none}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.86.0/phaser.min.js"></script></head><body><div id="game"></div><script>
const W=384,H=320;
class Village extends Phaser.Scene{
 constructor(){super('Village');this.held={};this.talking=false;this.stage=0;this.facing='down';this.walkTime=0;this.inside=false;}
 tex(name,w,h,fn){const t=this.textures.createCanvas(name,w,h),c=t.context;c.imageSmoothingEnabled=false;fn(c);t.refresh()}
 rect(c,x,y,w,h,color){c.fillStyle=color;c.fillRect(x,y,w,h)}
 art(){const R=(c,...args)=>this.rect(c,...args);
  for(const role of ['hero','elder'])for(const face of ['down','up','side'])for(let frame=0;frame<2;frame++)this.tex(`${role}_${face}_${frame}`,16,24,c=>{
   const r=(...a)=>R(c,...a),elder=role==='elder',skin=elder?'#d8ac86':'#e8b17d',hair=elder?'#ddd7bb':'#483349',coat=elder?'#76568f':'#286c9a';
   r(4,1,8,5,hair);r(3,4,10,7,skin);if(face==='up'){r(4,3,8,8,hair)}else if(face==='down'){r(5,7,2,2,'#27283e');r(10,7,2,2,'#27283e')}else{r(10,7,2,2,'#27283e');r(3,6,2,3,hair)}
   if(elder&&face!=='up')r(5,11,7,4,'#e9e4d9');r(4,12,8,7,coat);r(2,13,2,6,skin);r(12,13,2,6,skin);r(6,13,4,3,elder?'#a99bca':'#e1c77a');
   r(4,19,4,4,elder?'#4d3b60':'#39334d');r(9,19,4,4,elder?'#4d3b60':'#39334d');if(frame){r(3,22,5,2,'#252437');r(10,21,5,2,'#252437')}else{r(4,21,5,3,'#252437');r(9,22,5,2,'#252437')}
  });
  this.tex('tree',32,40,c=>{const r=(...a)=>R(c,...a);r(12,25,9,14,'#72513a');r(4,15,26,17,'#22523a');r(1,17,30,11,'#307249');r(6,6,21,19,'#388751');r(11,2,14,10,'#54a265');r(10,11,8,5,'#69b574');r(22,17,6,5,'#275e3f')});
  this.tex('house',72,64,c=>{const r=(...a)=>R(c,...a);r(7,22,58,41,'#634b48');r(11,26,50,33,'#ac8061');r(1,22,70,7,'#4b3b4b');r(7,10,58,14,'#8c4551');r(15,4,42,8,'#b65d61');r(22,0,28,6,'#d47a71');for(let i=0;i<6;i++)r(12+i*9,17,6,3,'#d48970');r(14,35,15,15,'#3a5261');r(17,37,9,10,'#a4d9d8');r(43,35,17,27,'#44323c');r(55,48,2,2,'#edcb82')});
  this.tex('crystal',24,32,c=>{const r=(...a)=>R(c,...a);r(4,26,16,5,'#5a546d');r(8,4,9,23,'#2e5eae');r(5,10,14,13,'#459bd3');r(11,1,4,24,'#a1f1f1');r(7,11,4,10,'#6de1ed');r(16,13,3,7,'#2554a0')});
  this.tex('flower',8,8,c=>{const r=(...a)=>R(c,...a);r(3,3,2,5,'#2b6540');r(1,2,6,3,'#efbddb');r(3,0,2,7,'#efbddb');r(3,3,2,2,'#f7dc7c')});
 }
 create(){this.art();this.cameras.main.setBackgroundColor('#101626');this.world=this.add.container(0,0);this.drawWorld();this.elder=this.add.image(190,87,'elder_down_0').setOrigin(.5,1);this.world.add(this.elder);this.crystal=this.add.image(323,183,'crystal');this.world.add(this.crystal);this.tweens.add({targets:this.crystal,y:179,alpha:{from:.7,to:1},duration:950,yoyo:true,repeat:-1});this.playerX=190;this.playerY=157;this.player=this.add.image(this.playerX,this.playerY,'hero_down_0').setOrigin(.5,1);this.world.add(this.player);
  this.add.rectangle(192,11,384,22,0x18243b,.98);this.add.text(192,11,'ECHOES OF THE CRYSTAL',{fontFamily:'monospace',fontSize:'12px',color:'#f4dca1',fontStyle:'bold'}).setOrigin(.5);
  this.quest=this.add.text(7,27,'QUEST: Speak with the Elder',{fontFamily:'monospace',fontSize:'10px',color:'#fff',backgroundColor:'#1a2942',padding:{x:4,y:3}});
  this.add.rectangle(192,281,384,78,0x19263c).setStrokeStyle(2,0xb4a2ce);this.add.text(192,249,'D-PAD: MOVE        ACTION: TALK',{fontFamily:'monospace',fontSize:'9px',color:'#e5d9b9'}).setOrigin(.5);this.controls();
  this.dialogBg=this.add.rectangle(192,204,370,66,0x19243a,.98).setStrokeStyle(2,0xe7d8a1).setDepth(30).setVisible(false);this.dialogText=this.add.text(18,176,'',{fontFamily:'monospace',fontSize:'11px',color:'#fff',wordWrap:{width:348},lineSpacing:3}).setDepth(31).setVisible(false);
  this.nameText=this.add.text(190,89,'ELDER',{fontFamily:'monospace',fontSize:'8px',color:'#fff'}).setOrigin(.5);this.world.add(this.nameText);
  this.cursors=this.input.keyboard?.createCursorKeys();this.keys=this.input.keyboard?.addKeys('W,A,S,D,SPACE');this.input.on('gameout',()=>this.held={});this.input.on('pointerup',()=>this.held={});
 }
 drawWorld(){const g=this.add.graphics();this.world.add(g);g.fillStyle(0x61965b).fillRect(0,0,384,240);for(let y=0;y<240;y+=8)for(let x=0;x<384;x+=8)if((x/8+y/8)%3===0)g.fillStyle(0x6aa162).fillRect(x,y,8,8);
  g.fillStyle(0xc9af80).fillRect(168,20,48,220).fillRect(0,111,384,40);g.fillStyle(0xd8c291);for(let y=26;y<240;y+=16)g.fillRect(172,y,40,2);for(let x=0;x<384;x+=16)g.fillRect(x,115,10,2);
  for(const [x,y] of [[6,35],[80,6],[304,4],[345,67],[8,187],[80,191],[285,201],[350,196]])this.world.add(this.add.image(x,y,'tree').setOrigin(0,0));this.world.add(this.add.image(36,43,'house').setOrigin(0,0));this.world.add(this.add.image(269,43,'house').setOrigin(0,0));for(const [x,y] of [[119,52],[131,75],[246,66],[260,84],[27,185],[96,185],[283,171],[343,181],[145,38]])this.world.add(this.add.image(x,y,'flower').setOrigin(0,0));
 }
 controls(){const button=(x,y,label,key,w=32,h=22)=>{const b=this.add.rectangle(x,y,w,h,0x43536f).setStrokeStyle(1,0xb2bfd7).setInteractive();this.add.text(x,y,label,{fontFamily:'monospace',fontSize:key==='action'?'13px':'14px',color:'#fff'}).setOrigin(.5);b.on('pointerdown',()=>{if(key==='action')this.action();else this.held[key]=true});b.on('pointerup',()=>this.held[key]=false);b.on('pointerout',()=>this.held[key]=false)};button(67,267,'▲','up');button(34,293,'◀','left');button(67,293,'▼','down');button(100,293,'▶','right');button(322,282,'TALK','action',85,44)}
 dialogue(msg){this.talking=true;this.dialogBg.setVisible(true);this.dialogText.setText(msg+'\nTap TALK to close.').setVisible(true)}
 closeDialogue(){this.talking=false;this.dialogBg.setVisible(false);this.dialogText.setVisible(false)}
 action(){if(this.talking){this.closeDialogue();return}const dist=(x,y)=>Math.hypot(this.playerX-x,this.playerY-y);
  if(this.inside){this.inside=false;this.world.setVisible(true);this.playerX=190;this.playerY=159;this.player.setPosition(this.playerX,this.playerY);this.dialogue('You step outside into the village.');return}
  if(dist(190,87)<53){this.elder.setTexture('elder_down_0');if(this.stage===0){this.stage=1;this.quest.setText('QUEST: Investigate the crystal');this.dialogue('ELDER: Our crystal is fading. Seek it east of town!')}else this.dialogue(this.stage===2?'ELDER: The light has returned. Thank you, hero!':'ELDER: Find the crystal east of town.');return}
  if(dist(323,183)<47){if(this.stage===0){this.dialogue('A strange crystal. Perhaps the Elder knows more.')}else if(this.stage===1){this.stage=2;this.quest.setText('QUEST COMPLETE: Crystal restored!');this.dialogue('The crystal shines! An ancient voice whispers: Your journey begins...')}else this.dialogue('The crystal glows with renewed light.');return}
  if((this.playerX>68&&this.playerX<102&&this.playerY>93&&this.playerY<133)){this.dialogue('The cottage door is locked.');return}
  this.dialogue('Nothing to interact with here.')
 }
 update(time,delta){if(this.talking)return;let dx=0,dy=0;const c=this.cursors,k=this.keys;if(this.held.left||c?.left.isDown||k?.A.isDown)dx--;if(this.held.right||c?.right.isDown||k?.D.isDown)dx++;if(this.held.up||c?.up.isDown||k?.W.isDown)dy--;if(this.held.down||c?.down.isDown||k?.S.isDown)dy++;
  if(dx||dy){let face=Math.abs(dx)>Math.abs(dy)?'side':dy<0?'up':'down';this.facing=face;const len=Math.hypot(dx,dy),speed=Math.min(delta,40)*.085;this.playerX=Phaser.Math.Clamp(this.playerX+dx/len*speed,9,375);this.playerY=Phaser.Math.Clamp(this.playerY+dy/len*speed,44,237);this.walkTime+=delta;this.player.setTexture(`hero_${face}_${Math.floor(this.walkTime/180)%2}`);this.player.setFlipX(face==='side'&&dx<0);this.player.setPosition(Math.round(this.playerX),Math.round(this.playerY))}else{this.walkTime=0;this.player.setTexture(`hero_${this.facing}_0`)}if(k?.SPACE&&Phaser.Input.Keyboard.JustDown(k.SPACE))this.action()
 }
}
new Phaser.Game({type:Phaser.AUTO,parent:'game',width:W,height:H,pixelArt:true,roundPixels:true,backgroundColor:'#101626',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Village],render:{antialias:false}});
</script></body></html>
