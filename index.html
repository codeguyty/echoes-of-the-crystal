 startTitle(){this.clearPlace();this.place='title';this.cameras.main.setBounds(0,0,320,240);this.add.rectangle(160,120,320,240,0x14213a);for(let i=0;i<40;i++){const x=(i*67+19)%320,y=(i*47+11)%240;this.add.rectangle(x,y,i%3===0?2:1,i%3===0?2:1,i%2?0x7187a2:0xc3d8e2,.6)}this.add.rectangle(160,196,320,88,0x233a49);this.add.rectangle(160,219,320,42,0x2e4d49);this.add.text(160,36,'ECHOES OF',{font:'bold 20px monospace',color:'#f4dba2',stroke:'#634c50',strokeThickness:3}).setOrigin(.5);this.add.text(160,65,'THE CRYSTAL',{font:'bold 23px monospace',color:'#f4dba2',stroke:'#634c50',strokeThickness:3}).setOrigin(.5);this.add.image(160,127,'crystal').setScale(2.4);this.add.image(126,108,'sparkle').setScale(.7);this.add.image(196,140,'sparkle').setScale(.55);this.add.text(160,191,'▶ NEW GAME',{font:'bold 15px monospace',color:'#ffffff'}).setOrigin(.5);this.add.text(160,223,'TAP TALK TO BEGIN',{font:'10px monospace',color:'#d6dced'}).setOrigin(.5);hud.style.display='none';document.getElementById('inventoryToggle').style.display='none'}

 village(x=465,y=430){this.clearPlace();this.place='village';this.cameras.main.setBounds(0,0,960,720);this.add.tileSprite(0,0,960,720,'grass-detail').setOrigin(0);const g=this.add.graphics();g.fillStyle(0xcab389);g.fillRect(0,320,960,82);g.fillRect(420,0,104,720);g.fillStyle(0xe0c99c);for(let a=0;a<960;a+=34){g.fillRect(a,335,17,3);g.fillRect(a,387,17,3)}for(let a=0;a<720;a+=28){g.fillRect(440,a,21,3);g.fillRect(491,a+14,18,3)}g.setDepth(0);
 this.addHouse(160,190,'home');this.addHouse(650,190,'shop');this.addHouse(170,490,'home');this.addHouse(655,485,'home');for(const p of [[50,80],[85,540],[800,80],[900,530],[310,105],[590,590],[890,290],[45,335],[320,620]])this.addTree(...p);for(let i=0;i<50;i++){const fx=(i*179+41)%910+25,fy=(i*113+67)%660+25;if(Math.abs(fx-470)>100&&Math.abs(fy-360)>85)this.add.image(fx,fy,'flower').setDepth(fy)}
 this.add.image(730,590,'shrine').setDepth(595);this.addWall(704,590,52,20);this.crystal=this.add.image(730,562,'crystal').setDepth(600);this.tweens.add({targets:this.crystal,y:556,duration:1100,yoyo:true,repeat:-1,ease:'Sine.inOut'});this.addTarget(730,565,63,()=>this.crystalAction());
 this.add.image(465,270,'elder').setDepth(275);this.add.text(465,245,'ELDER',{font:'10px monospace',color:'#fff3c7',stroke:'#172238',strokeThickness:3}).setOrigin(.5).setDepth(300);this.addWall(452,256,26,25);this.addTarget(465,270,62,()=>this.elderAction());
 this.add.image(350,490,'villager').setDepth(495);this.addWall(339,477,22,25);this.addTarget(350,490,49,()=>this.say('Mira',['The village shop sells herbs and charms.','Look for the teal-roofed house!']));
 this.add.image(590,565,'crystal').setTint(0x89ff91).setScale(.8).setDepth(575);this.add.text(590,534,'TRAINING',{font:'10px monospace',color:'#f8e7b2',stroke:'#14213a',strokeThickness:3}).setOrigin(.5).setDepth(580);this.addTarget(590,565,40,()=>this.beginBattle());this.makeHero(x,y);this.setQuest()}

 if(kind==='shop'){this.add.image(67,62,'shelf').setDepth(70);this.add.image(250,62,'shelf').setDepth(70);this.addWall(36,39,63,42);this.addWall(220,39,63,42);this.add.image(160,103,'counter').setDepth(110);this.addWall(115,94,90,27);this.add.image(160,69,'merchant').setDepth(72);this.addTarget(160,103,69,()=>this.openPanel('shopPanel'));this.add.text(160,28,'ALDERBROOK GOODS',{font:'12px monospace',color:'#ffe1a1'}).setOrigin(.5)}
 else{this.add.image(80,70,'table').setDepth(90);this.addWall(55,55,50,28);this.add.image(252,65,'shelf').setDepth(90);this.addWall(222,42,62,45);this.add.image(160,92,'villager').setDepth(100);this.addWall(148,79,24,24);this.addTarget(160,92,53,()=>this.say('Villager',['Come in and warm yourself by the hearth.','The crystal has watched over Alderbrook for generations.']));this.add.text(160,28,'VILLAGE HOME',{font:'12px monospace',color:'#ffe1a1'}).setOrigin(.5)}
 this.addTarget(160,218,39,()=>this.village(this.savedX,this.savedY));this.add.text(160,208,'EXIT ▼',{font:'10px monospace',color:'#ffe6aa',stroke:'#382b30',strokeThickness:3}).setOrigin(.5);this.makeHero(160,175);this.setQuest()}
 setQuest(){hud.style.display='flex';document.getElementById('inventoryToggle').style.display='block';document.getElementById('questText').textContent=['Talk to the Elder','Investigate the crystal','Return to the Elder','Crystal restored!'][this.quest];this.updateGold()}
 say(name,lines){this.page=lines.slice();this.speaker=name;this.dialogOpen=true;this.nextLine()}
 nextLine(){if(!this.page.length){dialog.style.display='none';this.dialogOpen=false;return}const safe=s=>s.replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));dialog.style.display='block';dialog.innerHTML='<b>'+safe(this.speaker)+'</b>\n'+safe(this.page.shift())+'\n[Tap TALK to continue]'}
 elderAction(){if(this.quest===0){this.quest=1;this.say('Elder',['The crystal at the eastern shrine has faded.','Please investigate its ancient light.'])}else if(this.quest===2){this.quest=3;this.say('Elder',['You restored the crystal! Alderbrook is safe.','Your adventure is only beginning...'])}else this.say('Elder',[this.quest===1?'The shrine lies southeast of here.':'The village owes you its thanks.']);this.setQuest()}
 crystalAction(){if(this.quest===1){this.quest=2;this.say('Crystal',['A brilliant light bursts from the crystal!','Return to the Elder with the news.'])}else this.say('Crystal',[this.quest===0?'The crystal is dim. Ask the Elder about it.':'The crystal hums with peaceful energy.']);this.setQuest()}
  updateGold(){document.getElementById('goldText').textContent=`${this.gold} G`}
  setupPanels(){document.getElementById('inventoryToggle').addEventListener('click',()=>this.openPanel('inventoryPanel'));for(const b of document.querySelectorAll('[data-close]'))b.addEventListener('click',()=>this.closePanel());document.getElementById('shopItems').addEventListener('click',e=>{const b=e.target.closest('[data-buy]');if(b)this.buy(b.dataset.buy)});document.getElementById('inventoryItems').addEventListener('click',e=>{const b=e.target.closest('[data-use]');if(b)this.useItem(b.dataset.use)})}
  openPanel(id){if(this.battleActive||this.place==='title')return;this.dialogOpen=false;dialog.style.display='none';this.closePanel();this.panel=id;document.getElementById(id).hidden=false;this.renderPanels()}
  closePanel(){for(const id of ['shopPanel','inventoryPanel'])document.getElementById(id).hidden=true;this.panel=null}
  renderPanels(){this.updateGold();const items=[['potion','Potion',10,'Restores 15 HP'],['ether','Ether',16,'Restores 6 MP'],['bronzeSword','Bronze Sword',28,'Adds 3 attack damage'],['leatherVest','Leather Vest',25,'Reduces incoming damage by 2']];document.getElementById('shopGold').textContent=`Your gold: ${this.gold} G`;document.getElementById('shopItems').innerHTML=items.map(([id,name,cost,note])=>`<div class="shop-row"><div><strong>${name}</strong><small class="item-note">${note}</small></div><div class="shop-buy"><span>${cost} G</span><button data-buy="${id}" ${this.gold<cost?'disabled':''}>BUY</button></div></div>`).join('');document.getElementById('inventoryStats').textContent=`HP ${this.heroHP}/${this.maxHP} | MP ${this.heroMP}/${this.maxMP} | ${this.gold} G`;document.getElementById('inventoryItems').innerHTML=items.map(([id,name,cost,note])=>`<div class="inventory-row"><div><strong>${name} × ${this.inventory[id]}</strong><small class="item-note">${note}${this.equipment[id==='bronzeSword'?'weapon':'armor']&&['bronzeSword','leatherVest'].includes(id)?' (EQUIPPED)':''}</small></div><button data-use="${id}" ${!this.inventory[id]?'disabled':''}>${['potion','ether'].includes(id)?'USE':'EQUIP'}</button></div>`).join('')}
  buy(id){const costs={potion:10,ether:16,bronzeSword:28,leatherVest:25};if(!(id in costs)||this.gold<costs[id])return;this.gold-=costs[id];this.inventory[id]++;this.potions=this.inventory.potion;document.getElementById('shopMessage').textContent='Purchase complete!';this.renderPanels()}
  useItem(id){if(!this.inventory[id])return;let msg='';if(id==='potion'){if(this.heroHP>=this.maxHP)msg='HP is already full.';else{this.heroHP=Math.min(this.maxHP,this.heroHP+15);this.inventory.potion--;this.potions=this.inventory.potion;msg='Potion used!'}}else if(id==='ether'){if(this.heroMP>=this.maxMP)msg='MP is already full.';else{this.heroMP=Math.min(this.maxMP,this.heroMP+6);this.inventory.ether--;msg='Ether used!'}}else if(id==='bronzeSword'){this.equipment.weapon=true;msg='Bronze Sword equipped!'}else if(id==='leatherVest'){this.equipment.armor=true;msg='Leather Vest equipped!'}document.getElementById('inventoryMessage').textContent=msg;this.renderPanels()}
  effect(target,value,heal=false){const el=document.createElement('span');el.className=`damage-number ${target}${heal?' heal':''}`;el.textContent=(heal?'+':'−')+value;document.getElementById('battleEffects').append(el);setTimeout(()=>el.remove(),850)}
  animateHit(id,cls){const el=document.getElementById(id);el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),400)}
  setupBattle(){this.battleBox=document.getElementById('battle');this.battleLog=document.getElementById('battleLog');this.battleStats=document.getElementById('heroStats');this.enemyStats=document.getElementById('enemyStats');this.moveButtons=[...document.querySelectorAll('[data-move]')];for(const b of this.moveButtons)b.addEventListener('pointerdown',e=>{e.preventDefault();this.playerTurn(b.dataset.move)});document.getElementById('battleContinue').addEventListener('pointerdown',e=>{e.preventDefault();this.endBattle()})}
  drawBattleArt(){
   const paint=(id,draw)=>{const canvas=document.getElementById(id),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,canvas.width,canvas.height);draw(ctx)};
   paint('battleHero',c=>{const p=(x,y,w,h,color)=>{c.fillStyle=color;c.fillRect(x,y,w,h)};c.fillStyle='#101a30aa';c.fillRect(10,73,44,4);p(17,47,13,18,'#49384b');p(34,47,13,18,'#49384b');p(15,62,17,7,'#302d3f');p(32,62,17,7,'#302d3f');p(15,31,34,24,'#70435a');p(12,33,8,21,'#d5a27f');p(44,33,8,21,'#d5a27f');p(17,29,30,27,'#315d98');p(25,30,14,25,'#d2a74d');p(21,10,22,20,'#ddb18c');p(19,7,26,8,'#503c38');p(20,10,24,5,'#985739');p(24,17,4,2,'#243246');p(37,17,4,2,'#243246');p(28,23,9,2,'#9c5c4b')});
   paint('battleEnemy',c=>{const p=(x,y,w,h,color)=>{c.fillStyle=color;c.fillRect(x,y,w,h)};c.fillStyle='#101a30aa';c.fillRect(8,64,64,5);p(11,47,58,16,'#237e62');p(15,37,50,17,'#2ea97b');p(20,28,40,15,'#46c492');p(27,24,26,7,'#75d8ac');p(23,40,8,10,'#f2ebc7');p(25,42,4,6,'#172945');p(49,40,8,10,'#f2ebc7');p(51,42,4,6,'#172945');p(31,55,18,3,'#185e55')});
  }
 beginBattle(){if(this.battleActive||this.panel)return;if(this.dialogOpen){this.dialogOpen=false;dialog.style.display='none'}this.battleActive=true;this.drawBattleArt();document.getElementById('battleEnemy').className='';document.getElementById('battleHero').className='';document.getElementById('battleScene').classList.remove('victory');document.getElementById('battleEffects').replaceChildren();this.enemyHP=24;this.enemyMaxHP=24;this.defending=false;this.battleFinished=false;this.battleBox.style.display='flex';document.getElementById('battleContinue').style.display='none';document.getElementById('battleButtons').style.display='grid';this.battleLog.textContent='A forest slime appears! Choose your action.';this.updateBattleStats()}
 updateBattleStats(){this.battleStats.innerHTML=`<div class="stat-row"><b>HERO</b><span>HP ${this.heroHP}/${this.maxHP}</span></div><div class="meter"><i style="width:${100*this.heroHP/this.maxHP}%"></i></div><div class="stat-row"><span>MP ${this.heroMP}/${this.maxMP}</span><span>POTIONS ${this.potions}</span></div><div class="meter mp"><i style="width:${100*this.heroMP/this.maxMP}%"></i></div>`;this.enemyStats.innerHTML=`<div class="stat-row"><b>FOREST SLIME</b><span>${Math.max(0,this.enemyHP)}/${this.enemyMaxHP}</span></div><div class="meter enemy"><i style="width:${100*Math.max(0,this.enemyHP)/this.enemyMaxHP}%"></i></div>`}
 playerTurn(move){if(!this.battleActive||this.battleFinished||this.turnBusy)return;let msg='';if(move==='attack'){const dmg=7+(this.equipment.weapon?3:0)+Math.floor(Math.random()*5);this.enemyHP-=dmg;this.effect('enemy',dmg);this.animateHit('battleHero','attack');this.animateHit('battleEnemy','hit');msg=`You attack for ${dmg} damage!`}else if(move==='magic'){if(this.heroMP<4){this.battleLog.textContent='Not enough MP!';return}this.heroMP-=4;const dmg=11+Math.floor(Math.random()*5);this.enemyHP-=dmg;this.effect('enemy',dmg);this.animateHit('battleHero','attack');this.animateHit('battleEnemy','hit');msg=`Crystal Bolt deals ${dmg} damage!`}else if(move==='item'){if(this.potions<=0){this.battleLog.textContent='No potions left!';return}this.potions--;this.inventory.potion=this.potions;const heal=Math.min(15,this.maxHP-this.heroHP);this.heroHP+=heal;this.effect('hero',heal,true);msg=`You recover ${heal} HP!`}else{this.defending=true;msg='You brace for the enemy attack.'}this.updateBattleStats();if(this.enemyHP<=0){this.battleFinished=true;this.battleWon=true;document.getElementById('battleEnemy').classList.add('defeated');document.getElementById('battleScene').classList.add('victory');this.gold+=8;this.updateGold();this.xp+=12;this.battleLog.textContent=msg+'\nVictory! +12 XP, +8 gold.';this.finishBattle();return}this.turnBusy=true;this.battleLog.textContent=msg+'\nThe slime prepares to strike...';this.time.delayedCall(750,()=>{if(!this.battleActive)return;const damage=Math.max(1,4+Math.floor(Math.random()*5)-(this.defending?4:0)-(this.equipment.armor?2:0));this.defending=false;this.heroHP=Math.max(0,this.heroHP-damage);this.effect('hero',damage);this.animateHit('battleHero','hit');this.updateBattleStats();this.battleLog.textContent=`${msg}\nSlime attacks for ${damage} damage.`;this.turnBusy=false;if(this.heroHP<=0){this.battleFinished=true;this.battleLog.textContent+='\nYou were defeated. Rest and try again.';this.finishBattle()}})}
 finishBattle(){document.getElementById('battleButtons').style.display='none';document.getElementById('battleContinue').style.display='block'}
 endBattle(){this.battleBox.style.display='none';this.battleActive=false;this.turnBusy=false;if(this.heroHP<=0){this.heroHP=30;this.heroMP=10}this.say('Narrator',[this.battleWon?'Battle complete! Total XP: '+this.xp+'  Gold: '+this.gold:'You recover and return to the village.']);this.battleWon=false;this.maxHP=30;this.maxMP=10;this.inventory={potion:2,ether:0,bronzeSword:0,leatherVest:0};this.equipment={weapon:false,armor:false};this.panel=null}
 action(){if(this.place==='title'){this.quest=0;this.heroHP=30;this.heroMP=10;this.potions=2;this.gold=0;this.xp=0;this.inventory={potion:2,ether:0,bronzeSword:0,leatherVest:0};this.equipment={weapon:false,armor:false};this.village();this.say('Narrator',['Welcome to Alderbrook Village.','Find the Elder near the north crossroads.']);return}if(this.battleActive||this.panel)return;if(this.dialogOpen){this.nextLine();return}const nearby=this.targets.map(t=>({...t,d:Phaser.Math.Distance.Between(this.hero.x,this.hero.y,t.x,t.y)})).filter(t=>t.d<t.r).sort((a,b)=>a.d-b.d)[0];if(nearby)nearby.callback();else this.say('Narrator',['Nothing to interact with here.','Try a doorway, a villager, or the crystal.'])}
 blocked(x,y){if(x<18||y<23||x>(this.place==='room'?302:942)||y>(this.place==='room'?225:704))return true;const foot={x:x-9,y:y+5,w:18,h:13};return this.walls.some(b=>foot.x<b.x+b.w&&foot.x+foot.w>b.x&&foot.y<b.y+b.h&&foot.y+foot.h>b.y)}
 update(_time,delta){if(!this.hero||this.battleActive||this.panel)return;let dx=Number(held.right||this.keys.D.isDown||this.keys.RIGHT.isDown)-Number(held.left||this.keys.A.isDown||this.keys.LEFT.isDown),dy=Number(held.down||this.keys.S.isDown||this.keys.DOWN.isDown)-Number(held.up||this.keys.W.isDown||this.keys.UP.isDown);if(this.dialogOpen){dx=0;dy=0}const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;const speed=115,step=Math.min(delta,40)/1000*speed;if(dx||dy){this.facing=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');this.step+=delta;const nx=this.hero.x+dx*step,ny=this.hero.y+dy*step;if(!this.blocked(nx,this.hero.y))this.hero.x=nx;if(!this.blocked(this.hero.x,ny))this.hero.y=ny;this.hero.setTexture(`hero-${this.facing}-${Math.floor(this.step/170)%2}`)}else{this.step=0;this.hero.setTexture(`hero-${this.facing}-0`)}this.hero.setDepth(this.hero.y+1)}
}
if(typeof Phaser==='undefined'){document.getElementById('error').style.display='block';document.getElementById('error').textContent='Phaser did not load. Check your internet connection and reload.'}else new Phaser.Game({type:Phaser.AUTO,parent:'game',width:320,height:240,pixelArt:true,roundPixels:true,backgroundColor:'#172238',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Adventure]});
