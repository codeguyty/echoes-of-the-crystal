<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" name="viewport"/>
  <!-- V9.2e startup repair: classic scripts in dependency order -->
  <title>
   Echoes of the Crystal V9.1 — The Alderbrook Expansion
  </title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js">
  </script>
  <link href="styles/game.css" rel="stylesheet"/>
 </head>
 <body>
  <div id="rotate">
   ↻ Rotate your iPhone to landscape
   <small>
    Turn off Portrait Orientation Lock if needed.
   </small>
  </div>
  <main id="layout">
   <div id="left">
    <div id="pad">
     <span class="blank">
     </span>
     <button class="key" data-dir="up">
      ▲
     </button>
     <span class="blank">
     </span>
     <button class="key" data-dir="left">
      ◀
     </button>
     <span class="blank">
     </span>
     <button class="key" data-dir="right">
      ▶
     </button>
     <span class="blank">
     </span>
     <button class="key" data-dir="down">
      ▼
     </button>
     <span class="blank">
     </span>
    </div>
   </div>
   <div id="screen">
    <div id="game">
    </div>
    <div id="hud">
     <span id="questText">
     </span>
     <span id="goldText">
     </span>
    </div>
    <button aria-label="Open inventory" id="inventoryToggle">
     BAG
    </button>
    <button aria-label="Save game" id="saveToggle">
     SAVE
    </button>
    <div id="dialog">
    </div>
    <section aria-label="Turn based battle" id="battle">
     <h2>
      THE FIRST ENCOUNTER
     </h2>
     <div id="battleScene">
      <div id="battleEffects">
      </div>
      <canvas aria-label="Hero" height="80" id="battleHero" width="64">
      </canvas>
      <canvas aria-label="Forest slime" height="72" id="battleEnemy" width="80">
      </canvas>
     </div>
     <div id="battleStats">
      <div class="battle-stat-card" id="heroStats">
      </div>
      <div class="battle-stat-card" id="enemyStats">
      </div>
     </div>
     <div aria-live="polite" id="battleLog">
     </div>
     <div id="battleButtons">
      <button data-move="attack">
       ATTACK
      </button>
      <button data-move="magic">
       MAGIC
      </button>
      <button data-move="item">
       ITEM
      </button>
      <button data-move="defend">
       DEFEND
      </button>
     </div>
     <button id="battleContinue">
      RETURN TO VILLAGE
     </button>
    </section>
    <section class="modal-panel" hidden="" id="shopPanel">
     <div class="panel-heading">
      <h2>
       ALDERBROOK GOODS
      </h2>
      <button class="panel-close" data-close="shopPanel">
       CLOSE
      </button>
     </div>
     <p class="panel-gold" id="shopGold">
     </p>
     <div class="panel-items" id="shopItems">
     </div>
     <p aria-live="polite" class="panel-message" id="shopMessage">
     </p>
    </section>
    <section class="modal-panel" hidden="" id="inventoryPanel">
     <div class="panel-heading">
      <h2>
       INVENTORY
      </h2>
      <button class="panel-close" data-close="inventoryPanel">
       CLOSE
      </button>
     </div>
     <p class="panel-gold" id="inventoryStats">
     </p>
     <div class="panel-items" id="inventoryItems">
     </div>
     <p aria-live="polite" class="panel-message" id="inventoryMessage">
     </p>
    </section>
   </div>
   <div id="right">
    <button class="key" id="action">
     TALK
     <br/>
     / NEXT
    </button>
   </div>
  </main>
  <div id="error">
  </div>
  <script src="src/input/touchControls.js">
  </script>
  <script src="src/assets/assetManifest.js"></script>
  <script src="src/art/villageBuildings.js"></script>
  <script src="src/scenes/AdventureScene.js">
  </script>
  <script src="src/config/gameConfig.js">
  </script>
  <script src="src/main.js">
  </script>
 </body>
</html>
