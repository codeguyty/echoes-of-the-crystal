 elderAction(){if(this.quest===0){this.quest=1;this.say('Elder',['The crystal at the eastern shrine has faded.','Please investigate its ancient light.'])}else if(this.quest===2){this.quest=3;this.say('Elder',['You restored the crystal! Alderbrook is safe.','Your adventure is only beginning...'])}else this.say('Elder',[this.quest===1?'The shrine lies southeast of here.':'The village owes you its thanks.']);this.setQuest()}
 crystalAction(){if(this.quest===1){this.quest=2;this.say('Crystal',['A brilliant light bursts from the crystal!','Return to the Elder with the news.'])}else this.say('Crystal',[this.quest===0?'The crystal is dim. Ask the Elder about it.':'The crystal hums with peaceful energy.']);this.setQuest()}
 setupBattle(){this.battleBox=document.getElementById('battle');this.battleLog=document.getElementById('battleLog');this.battleStats=document.getElementById('heroStats');this.enemyStats=document.getElementById('enemyStats');this.moveButtons=[...document.querySelectorAll('[data-move]')];for(const b of this.moveButtons)b.addEventListener('pointerdown',e=>{e.preventDefault();this.playerTurn(b.dataset.move)});document.getElementById('battleContinue').addEventListener('pointerdown',e=>{e.preventDefault();this.endBattle()})}
 beginBattle(){if(this.battleActive)return;if(this.dialogOpen){this.dialogOpen=false;dialog.style.display='none'}this.battleActive=true;this.drawBattleArt();document.getElementById('battleEnemy').style.opacity='1';this.enemyHP=24;this.enemyMaxHP=24;this.defending=false;this.battleFinished=false;this.battleBox.style.display='flex';document.getElementById('battleContinue').style.display='none';document.getElementById('battleButtons').style.display='grid';this.battleLog.textContent='A forest slime appears! Choose your action.';this.updateBattleStats()}
 updateBattleStats(){this.battleStats.textContent=`HERO HP ${this.heroHP}/30  MP ${this.heroMP}/10  POTIONS ${this.potions}`;this.enemyStats.textContent=`SLIME HP ${Math.max(0,this.enemyHP)}/${this.enemyMaxHP}`}
 playerTurn(move){if(!this.battleActive||this.battleFinished||this.turnBusy)return;let msg='';if(move==='attack'){const dmg=7+Math.floor(Math.random()*5);this.enemyHP-=dmg;msg=`You attack for ${dmg} damage!`}else if(move==='magic'){if(this.heroMP<4){this.battleLog.textContent='Not enough MP!';return}this.heroMP-=4;const dmg=11+Math.floor(Math.random()*5);this.enemyHP-=dmg;msg=`Crystal Bolt deals ${dmg} damage!`}else if(move==='item'){if(this.potions<=0){this.battleLog.textContent='No potions left!';return}this.potions--;const heal=Math.min(15,30-this.heroHP);this.heroHP+=heal;msg=`You recover ${heal} HP!`}else{this.defending=true;msg='You brace for the enemy attack.'}this.updateBattleStats();if(this.enemyHP<=0){this.battleFinished=true;this.battleWon=true;document.getElementById('battleEnemy').style.opacity='.3';this.gold+=8;this.xp+=12;this.battleLog.textContent=msg+'\nVictory! +12 XP, +8 gold.';this.finishBattle();return}this.turnBusy=true;this.battleLog.textContent=msg+'\nThe slime prepares to strike...';this.time.delayedCall(750,()=>{if(!this.battleActive)return;const damage=Math.max(1,4+Math.floor(Math.random()*5)-(this.defending?4:0));this.defending=false;this.heroHP=Math.max(0,this.heroHP-damage);this.updateBattleStats();this.battleLog.textContent=`${msg}\nSlime attacks for ${damage} damage.`;this.turnBusy=false;if(this.heroHP<=0){this.battleFinished=true;this.battleLog.textContent+='\nYou were defeated. Rest and try again.';this.finishBattle()}})}
 finishBattle(){document.getElementById('battleButtons').style.display='none';document.getElementById('battleContinue').style.display='block'}
 endBattle(){this.battleBox.style.display='none';this.battleActive=false;this.turnBusy=false;if(this.heroHP<=0){this.heroHP=30;this.heroMP=10}this.say('Narrator',[this.battleWon?'Battle complete! Total XP: '+this.xp+'  Gold: '+this.gold:'You recover and return to the village.']);this.battleWon=false}
 action(){if(this.place==='title'){this.quest=0;this.heroHP=30;this.heroMP=10;this.potions=2;this.gold=0;this.xp=0;this.village();this.say('Narrator',['Welcome to Alderbrook Village.','Find the Elder near the north crossroads.']);return}if(this.battleActive)return;if(this.dialogOpen){this.nextLine();return}const nearby=this.targets.map(t=>({...t,d:Phaser.Math.Distance.Between(this.hero.x,this.hero.y,t.x,t.y)})).filter(t=>t.d<t.r).sort((a,b)=>a.d-b.d)[0];if(nearby)nearby.callback();else this.say('Narrator',['Nothing to interact with here.','Try a doorway, a villager, or the crystal.'])}
 blocked(x,y){if(x<18||y<23||x>(this.place==='room'?302:942)||y>(this.place==='room'?225:704))return true;const foot={x:x-9,y:y+5,w:18,h:13};return this.walls.some(b=>foot.x<b.x+b.w&&foot.x+foot.w>b.x&&foot.y<b.y+b.h&&foot.y+foot.h>b.y)}
 update(_time,delta){if(!this.hero||this.battleActive)return;let dx=Number(held.right||this.keys.D.isDown||this.keys.RIGHT.isDown)-Number(held.left||this.keys.A.isDown||this.keys.LEFT.isDown),dy=Number(held.down||this.keys.S.isDown||this.keys.DOWN.isDown)-Number(held.up||this.keys.W.isDown||this.keys.UP.isDown);if(this.dialogOpen){dx=0;dy=0}const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;const speed=115,step=Math.min(delta,40)/1000*speed;if(dx||dy){this.facing=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');this.step+=delta;const nx=this.hero.x+dx*step,ny=this.hero.y+dy*step;if(!this.blocked(nx,this.hero.y))this.hero.x=nx;if(!this.blocked(this.hero.x,ny))this.hero.y=ny;this.hero.setTexture(`hero-${this.facing}-${Math.floor(this.step/170)%2}`)}else{this.step=0;this.hero.setTexture(`hero-${this.facing}-0`)}this.hero.setDepth(this.hero.y+1)}
}
if(typeof Phaser==='undefined'){document.getElementById('error').style.display='block';document.getElementById('error').textContent='Phaser did not load. Check your internet connection and reload.'}else new Phaser.Game({type:Phaser.AUTO,parent:'game',width:320,height:240,pixelArt:true,roundPixels:true,backgroundColor:'#172238',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Adventure]});
</script></body></html>
